<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"><defs><marker id="2563EB" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker><marker id="087F8C" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087F8C"/></marker><marker id="64748B" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker><marker id="7C3AED" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="172B4D" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#172B4D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="52.5" font-size="32" fill="#172B4D" text-anchor="start" dominant-baseline="middle"><tspan x="40" dy="0">요청 1건의 실행 흐름 · ReAct 예시</tspan></text><text x="40" y="102.5" font-size="18" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="40" dy="0">Workflow도 각 단계에서 같은 SDK 인터페이스를 사용한다. 프롬프트·RAG·도구 호출은 시나리오에 따라 선택한다.</tspan></text><rect x="30" y="155" width="200" height="75" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" /><text x="130.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="130.0" dy="0">요청자</tspan></text><polyline points="130,230 130,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="300" y="155" width="200" height="75" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" /><text x="400.0" y="179.9" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="400.0" dy="0">에이전트</tspan><tspan x="400.0" dy="25.2">자체 토폴로지</tspan></text><polyline points="400,230 400,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="570" y="155" width="200" height="75" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" /><text x="670.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="670.0" dy="0">KPAP SDK</tspan></text><polyline points="670,230 670,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="840" y="155" width="200" height="75" rx="10" fill="#EFFAF7" stroke="#087F8C" stroke-width="1.5" /><text x="940.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="940.0" dy="0">프롬프트 조회</tspan></text><polyline points="940,230 940,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="1090" y="155" width="200" height="75" rx="10" fill="#EFFAF7" stroke="#087F8C" stroke-width="1.5" /><text x="1190.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1190.0" dy="0">RAG 호출</tspan></text><polyline points="1190,230 1190,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="1330" y="155" width="200" height="75" rx="10" fill="#EFFAF7" stroke="#087F8C" stroke-width="1.5" /><text x="1430.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1430.0" dy="0">LLM Gateway</tspan></text><polyline points="1430,230 1430,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><rect x="1580" y="155" width="200" height="75" rx="10" fill="#EFFAF7" stroke="#087F8C" stroke-width="1.5" /><text x="1680.0" y="192.5" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1680.0" dy="0">도구 호출 프록시</tspan></text><polyline points="1680,230 1680,1020" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" /><polyline points="130,275 400,275" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="265.0" y="262.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="0">① 요청 + 실행 컨텍스트</tspan></text><polyline points="400,330 670,330" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="535.0" y="317.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="0">② 프롬프트 조회 (선택)</tspan></text><polyline points="670,370 940,370" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><text x="805.0" y="357.0" font-size="15" fill="#087F8C" text-anchor="middle" dominant-baseline="middle"><tspan x="805.0" dy="0">ID / 버전</tspan></text><polyline points="940,410 670,410" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="805.0" y="397.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="805.0" dy="0">템플릿 / 설정</tspan></text><polyline points="670,410 400,410" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><polyline points="400,465 670,465" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="535.0" y="452.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="0">③ 근거 검색 (선택)</tspan></text><polyline points="670,505 1190,505" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><text x="930.0" y="492.0" font-size="15" fill="#087F8C" text-anchor="middle" dominant-baseline="middle"><tspan x="930.0" dy="0">질의 / 필터</tspan></text><polyline points="1190,545 670,545" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="930.0" y="532.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="930.0" dy="0">근거 / 출처</tspan></text><polyline points="670,545 400,545" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><rect x="280" y="590" width="1480" height="360" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/><text x="300" y="612.0" font-size="18" fill="#172B4D" text-anchor="start" dominant-baseline="middle"><tspan x="300" dy="0">ReAct 반복  |  종료 조건 또는 실행 한도까지 ④–⑥ 수행</tspan></text><polyline points="400,655 670,655" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="535.0" y="642.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="0">④ 메시지 + 근거 + 도구 스키마</tspan></text><polyline points="670,695 1430,695" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><text x="1050.0" y="682.0" font-size="15" fill="#087F8C" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" dy="0">모델 호출</tspan></text><polyline points="1430,735 670,735" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="1050.0" y="722.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" dy="0">생성 결과 / 도구 호출 제안</tspan></text><polyline points="670,735 400,735" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><polyline points="400,795 670,795" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="535.0" y="782.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="0">⑤ 필요 시 도구 실행 결정</tspan></text><polyline points="670,835 1680,835" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><text x="1175.0" y="822.0" font-size="15" fill="#087F8C" text-anchor="middle" dominant-baseline="middle"><tspan x="1175.0" dy="0">도구명 / 인자</tspan></text><polyline points="1680,875 670,875" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="1175.0" y="862.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="1175.0" dy="0">도구 실행 결과</tspan></text><polyline points="670,875 400,875" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="425" y="919.0" font-size="17" fill="#2563EB" text-anchor="start" dominant-baseline="middle"><tspan x="425" dy="0">⑥ 에이전트가 관찰 결과·상태를 갱신하고, 다음 행동 또는 종료를 결정</tspan></text><polyline points="400,990 130,990" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="265.0" y="977.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="0">⑦ 최종 응답 / 스트림 이벤트</tspan></text><text x="40" y="1077.4" font-size="18" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="40" dy="0">도구 호출 제안과 실제 도구 실행을 분리한다. 도구 실행 결과는 에이전트가 다음 LLM 입력에 반영한다.</tspan><tspan x="40" dy="25.2">오류·타임아웃은 SDK를 통해 토폴로지에 전달하며, 복구·분기·종료 정책은 상세 규격에서 정한다.</tspan></text></g></svg>