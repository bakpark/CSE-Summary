<rect x="91" y="761" width="4" height="118" rx="2" fill="#946824" stroke="none" stroke-width="1.5"/>
<text x="112" y="783" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">변경 검토 · 선택 반영</text>
<text x="112" y="820" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">현재 로컬과 제안 변경을 비교</text>
<text x="112" y="850" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">서비스 테스트 · 기존 검토·배포</text>
<rect x="640" y="288" width="330" height="180" rx="12" fill="#edf3fb" stroke="#a8bfd5" stroke-width="1.5"/>
<rect x="641" y="304" width="4" height="148" rx="2" fill="#2b648f" stroke="none" stroke-width="1.5"/>
<text x="662" y="326" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">① 형상 import</text>
<text x="662" y="363" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">Spec · 필요 소스 · 의존성</text>
<text x="662" y="393" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">출처와 정확한 내용 기록</text>
<text x="662" y="423" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">원래 파일 위치 대응</text>
<rect x="640" y="680" width="330" height="205" rx="12" fill="#fff7e9" stroke="#d8bd83" stroke-width="1.5"/>
<rect x="641" y="696" width="4" height="173" rx="2" fill="#946824" stroke="none" stroke-width="1.5"/>
<text x="662" y="718" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">② 변경점 공유</text>
<text x="662" y="755" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">기준 I1 ↔ 선정 E1 비교</text>
<text x="662" y="785" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">설정 변경 전·후 값</text>
<text x="662" y="815" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">평가 결과와 실행 기록</text>
<text x="662" y="845" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">실제 파일의 대응 위치</text>
<rect x="1110" y="225" width="500" height="125" rx="12" fill="#e3f1eb" stroke="#9dbfac" stroke-width="1.5"/>
<rect x="1111" y="241" width="4" height="93" rx="2" fill="#2a785d" stroke="none" stroke-width="1.5"/>
<text x="1132" y="263" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">가져온 기준 형상 I1</text>
<text x="1132" y="300" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">Agent 묶음을 자체 저장소에 고정</text>
<text x="1132" y="330" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">서비스 커밋과 Playground 커밋 구분</text>
<rect x="1110" y="435" width="500" height="180" rx="12" fill="#fff" stroke="#9dbfac" stroke-width="1.5"/>
<rect x="1111" y="451" width="4" height="148" rx="2" fill="#2a785d" stroke="none" stroke-width="1.5"/>
<text x="1132" y="473" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">실험 형상 E1 · Runner · 평가</text>
<text x="1132" y="510" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">기획자 · AI 엔지니어</text>
<text x="1132" y="540" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">허용 설정 변경과 실험 이력 저장</text>
<text x="1132" y="570" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">평가 근거를 정확한 실험 형상에 연결</text>
<rect x="1110" y="745" width="500" height="150" rx="12" fill="#e3f1eb" stroke="#9dbfac" stroke-width="1.5"/>
<rect x="1111" y="761" width="4" height="118" rx="2" fill="#2a785d" stroke="none" stroke-width="1.5"/>
<text x="1132" y="783" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">다음 import는 새 기준 형상 I2</text>
<text x="1132" y="820" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">기존 I1의 실험과 평가 이력은 보존</text>
<text x="1132" y="850" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">다시 가져오는 시점은 개발자가 선택</text>
<text x="337" y="397" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#66788a">체크아웃 · 개발</text>
<text x="991" y="267" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#2b648f">가져오기</text>
<text x="1380" y="397" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#2a785d">독립된 형상으로 실험</text>
<text x="820" y="553" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#66788a">기준 import에서</text>
<text x="820" y="580" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#66788a">변경점을 계산</text>
<text x="1029" y="646" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#946824">선정 실험</text>
<text x="595" y="776" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#946824">선택 적용</text>
<text x="338" y="688" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#66788a">같은 서비스 로컬</text>
<text x="173" y="963" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#66788a">서비스의 기존 형상관리 절차</text>
<text x="64" y="1033" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#51677b">파랑: 형상 import   |   황토: 변경점·평가 공유   |   서비스 반영과 Playground import는 자동 동기화하지 않는다.</text>
</svg>