<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1070" viewBox="0 0 1700 1070" role="img" aria-labelledby="title desc">
<title id="title">독립된 서비스 형상과 Playground 형상</title>
<desc id="desc">서비스 저장소의 개발자 로컬에서 plugin을 통해 에이전트 묶음을 Playground로 가져온다. KPAP 별도 GitHub 저장소에서 기준 형상과 실험을 관리한다. 기준 import와 선정 실험의 차이 및 평가 근거를 개발자에게 공유한다. 개발자는 실제 프로젝트 로컬에서 선택 반영하고 검증한다.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b648f"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#946824"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66788a"/></marker>
</defs><rect width="1700" height="1070" fill="white"/>
<text x="64" y="59" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#192d42">Agent Playground · 두 형상과 Plugin 교환 흐름</text>
<text x="64" y="102" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#51677b">개발자 로컬은 실제 서비스 프로젝트다. Playground는 별도 형상으로 실험한다.</text>
<rect x="64" y="150" width="520" height="790" rx="16" fill="#f1f5fa" stroke="#c9d8e7" stroke-width="1.5"/>
<rect x="1070" y="150" width="580" height="790" rx="16" fill="#eef7f4" stroke="#c4dbd1" stroke-width="1.5"/>
<text x="90" y="190" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">실제 서비스 형상</text>
<text x="1100" y="190" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#192d42">Playground 형상 · KPAP 별도 GitHub 저장소</text>
<text x="640" y="190" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#192d42">Plugin · import와 변경점 공유</text>
<polyline points="320,350 320,435" fill="none" stroke="#66788a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#grey)"/>
<polyline points="550,500 602,500 602,378 640,378" fill="none" stroke="#2b648f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="970,378 1020,378 1020,287 1110,287" fill="none" stroke="#2b648f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="1360,350 1360,435" fill="none" stroke="#2b648f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="805,468 805,680" fill="none" stroke="#66788a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#grey)"/>
<polyline points="1110,525 1020,525 1020,790 970,790" fill="none" stroke="#946824" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/>
<polyline points="640,790 550,790" fill="none" stroke="#946824" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/>
<polyline points="320,615 320,745" fill="none" stroke="#66788a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#grey)"/>
<polyline points="320,895 320,979 30,979 30,287 90,287" fill="none" stroke="#66788a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#grey)"/>
<rect x="90" y="225" width="460" height="125" rx="12" fill="#e8f0fa" stroke="#9bb7d1" stroke-width="1.5"/>
<rect x="91" y="241" width="4" height="93" rx="2" fill="#2b648f" stroke="none" stroke-width="1.5"/>
<text x="112" y="263" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">서비스 저장소</text>
<text x="112" y="300" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">개발자 · AI 엔지니어</text>
<text x="112" y="330" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">서비스 개발·검토·배포의 기준</text>
<rect x="90" y="435" width="460" height="180" rx="12" fill="#fff" stroke="#9bb7d1" stroke-width="1.5"/>
<rect x="91" y="451" width="4" height="148" rx="2" fill="#2b648f" stroke="none" stroke-width="1.5"/>
<text x="112" y="473" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192d42">개발자 로컬</text>
<text x="112" y="510" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">실제 서비스 프로젝트 작업 공간</text>
<text x="112" y="540" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">SDK 에이전트 범위를 선택해 export</text>
<text x="112" y="570" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#43576b">서비스 파일과 로컬 수정은 유지</text>
