 font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="735.0" dy="0">호환 에이전트 패키지</tspan><tspan x="735.0" dy="23.799999999999997">자체 토폴로지 + KPAP SDK 연동 코드</tspan></text><rect x="1090" y="205" width="640" height="65" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><text x="1410.0" y="225.6" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1410.0" dy="0">호환 규격 (제안)</tspan><tspan x="1410.0" dy="23.799999999999997">요청·응답 / 인증 컨텍스트 / 서비스 호출 인터페이스</tspan></text><polyline points="420,238 500,238" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="460.0" y="225.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" dy="0">개발</tspan></text><polyline points="1090,238 970,238" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><polyline points="735,270 735,320" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#64748B)"/><text x="830" y="303.0" font-size="15" fill="#64748B" text-anchor="middle" dominant-baseline="middle"><tspan x="830" dy="0">패키지 로드</tspan></text><rect x="285" y="330" width="765" height="665" rx="10" fill="#F8FAFF" stroke="#94B5F4" stroke-width="1.5" /><text x="310" y="362.5" font-size="23" fill="#2563EB" text-anchor="start" dominant-baseline="middle"><tspan x="310" dy="0">에이전트 런타임 · 배치 위치는 별도 결정</tspan></text><rect x="1130" y="330" width="365" height="665" rx="10" fill="#EFFAF7" stroke="#7CBBAE" stroke-width="1.5" /><text x="1150" y="362.5" font-size="23" fill="#087F8C" text-anchor="start" dominant-baseline="middle"><tspan x="1150" dy="0">KPAP 공통 서비스</tspan></text><text x="1540" y="362.5" font-size="22" fill="#172B4D" text-anchor="start" dominant-baseline="middle"><tspan x="1540" dy="0">연동 대상</tspan></text><rect x="40" y="435" width="195" height="100" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><text x="137.5" y="472.4" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="137.5" dy="0">요청자</tspan><tspan x="137.5" dy="25.2">Playground UI / API</tspan></text><rect x="315" y="420" width="300" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><text x="465.0" y="447.4" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="465.0" dy="0">요청 진입점</tspan><tspan x="465.0" dy="25.2">입력 검증 · 실행 컨텍스트</tspan></text><polyline points="235,460 315,460" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="275.0" y="447.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" dy="0">① 요청</tspan></text><rect x="315" y="535" width="345" height="300" rx="10" fill="#FFFFFF" stroke="#A8BFE7" stroke-width="1.5" /><text x="335" y="565.5" font-size="20" fill="#172B4D" text-anchor="start" dominant-baseline="middle"><tspan x="335" dy="0">자체 토폴로지 / 실행 상태</tspan></text><rect x="335" y="600" width="305" height="85" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="487.5" y="630.6" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="487.5" dy="0">ReAct</tspan><tspan x="487.5" dy="23.799999999999997">판단 → 행동 → 관찰 → 반복</tspan></text><rect x="335" y="710" width="305" height="85" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="487.5" y="740.6" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="487.5" dy="0">Workflow / Graph</tspan><tspan x="487.5" dy="23.799999999999997">단계 실행 → 분기 → 합류</tspan></text><polyline points="465,500 465,535" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><rect x="725" y="420" width="295" height="415" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" /><text x="745" y="452.5" font-size="23" fill="#2563EB" text-anchor="start" dominant-baseline="middle"><tspan x="745" dy="0">KPAP SDK</tspan></text><text x="745" y="488.8" font-size="16" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="745" dy="0">서비스 클라이언트 / 어댑터</tspan><tspan x="745" dy="22.4">인증·실행 컨텍스트 전달</tspan></text><rect x="750" y="550" width="245" height="45" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="872.5" y="572.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="872.5" dy="0">Prompt Client</tspan></text><rect x="750" y="625" width="245" height="45" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="872.5" y="647.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="872.5" dy="0">RAG Client</tspan></text><rect x="750" y="700" width="245" height="45" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="872.5" y="722.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="872.5" dy="0">LLM Client</tspan></text><rect x="750" y="775" width="245" height="45" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="872.5" y="797.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="872.5" dy="0">Tool Client</tspan></text><polyline points="660,570 725,570" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="693" y="550.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="693" dy="0">② 호출</tspan></text><polyline points="725,810 685,810 685,855 490,855 490,835" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="600" y="877.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="600" dy="0">결과 반영 / 다음 단계</tspan></text><text x="320" y="903.8" font-size="16" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="320" dy="0">토폴로지의 해당 노드에서 필요한 기능을 선택 호출</tspan><tspan x="320" dy="22.4">LLM의 도구 호출 제안은 에이전트가 해석한 뒤 Tool Client로 실행</tspan></text><rect x="315" y="945" width="705" height="35" rx="10" fill="#EFF6FF" stroke="#B6CEF8" stroke-width="1.5" /><text x="667.5" y="962.5" font-size="16" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="667.5" dy="0">③ 최종 응답 또는 스트리밍 이벤트</tspan></text><polyline points="315,963 260,963 260,515 235,515" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#2563EB)"/><text x="210" y="750.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle"><tspan x="210" dy="0">응답</tspan></text><rect x="1150" y="535" width="325" height="85" rx="10" fill="#FFFFFF" stroke="#9BCEC2" stroke-width="1.5" /><text x="1312.5" y="564.9" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1312.5" dy="0">프롬프트 조회</tspan><tspan x="1312.5" dy="25.2">ID·버전 → 템플릿 / 설정</tspan></text><rect x="1540" y="535" width="220" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><text x="1650.0" y="577.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1650.0" dy="0">프롬프트 저장소</tspan></text><polyline points="995,572 1065,572 1065,577 1150,577" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><polyline points="1475,577 1540,577" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><rect x="1150" y="645" width="325" height="85" rx="10" fill="#FFFFFF" stroke="#9BCEC2" stroke-width="1.5" /><text x="1312.5" y="674.9" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1312.5" dy="0">RAG 호출</tspan><tspan x="1312.5" dy="25.2">질의·필터 → 근거 / 출처</tspan></text><rect x="1540" y="645" width="220" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><text x="1650.0" y="687.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1650.0" dy="0">문서 / 검색 인덱스</tspan></text><polyline points="995,647 1077,647 1077,687 1150,687" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><polyline points="1475,687 1540,687" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><rect x="1150" y="755" width="325" height="85" rx="10" fill="#FFFFFF" stroke="#9BCEC2" stroke-width="1.5" /><text x="1312.5" y="784.9" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1312.5" dy="0">LLM Gateway</tspan><tspan x="1312.5" dy="25.2">메시지 → 생성 / 도구 호출 제안</tspan></text><rect x="1540" y="755" width="220" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><text x="1650.0" y="797.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1650.0" dy="0">LLM Provider(s)</tspan></text><polyline points="995,722 1089,722 1089,797 1150,797" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><polyline points="1475,797 1540,797" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><rect x="1150" y="865" width="325" height="85" rx="10" fill="#FFFFFF" stroke="#9BCEC2" stroke-width="1.5" /><text x="1312.5" y="894.9" font-size="18" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1312.5" dy="0">도구 호출 프록시</tspan><tspan x="1312.5" dy="25.2">도구명·인자 → 실행 결과</tspan></text><rect x="1540" y="865" width="220" height="85" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><text x="1650.0" y="907.5" font-size="17" fill="#172B4D" text-anchor="middle" dominant-baseline="middle"><tspan x="1650.0" dy="0">업무 API / MCP 서버</tspan></text><polyline points="995,810 1101,810 1101,907 1150,907" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><polyline points="1475,907 1540,907" fill="none" stroke="#087F8C" stroke-width="2" marker-end="url(#087F8C)"/><text x="40" y="1059.9" font-size="18" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="40" dy="0">경계 원칙  |  ReAct / Workflow는 에이전트 구현의 선택이다. KPAP은 공통 서비스 인터페이스를 제공한다.</tspan><tspan x="40" dy="25.2">실선 = 실행 중 호출 (결과는 호출 경로로 반환)   ·   점선 = 개발·패키징 흐름   ·   Claude Code Plugin은 개발 지원 역할</tspan></text><text x="40" y="1142.5" font-size="16" fill="#64748B" text-anchor="start" dominant-baseline="middle"><tspan x="40" dy="0">설계 가정: SDK를 런타임에 포함한다. 배치·전송 프로토콜·인증 방식·재시도 정책은 상세 규격에서 확정한다.</tspan></text></g></svg>