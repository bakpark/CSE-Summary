<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KPAP · Playground</title>
  <link rel="stylesheet" href="palette.css">
  <link rel="stylesheet" href="pilot.css">
  <link rel="stylesheet" href="reference-theme.css">
  <link rel="stylesheet" href="trace-inspection.css">
  <link rel="stylesheet" href="component-system.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="플랫폼 탐색">
      <a class="brand" href="#" aria-label="KPAP 홈">K<span>P</span>AP</a>
      <div class="rail-line"></div>
      <button class="rail-icon" aria-label="워크스페이스" disabled>▦</button>
      <button class="rail-icon current" aria-label="플레이그라운드"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6h4v8M6 10v8h8"/></svg></button>
      <div class="rail-bottom">BJ</div>
    </aside>
    <main>
      <header class="header">
        <div class="breadcrumb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h18v16H3zM9 4v16"/></svg><strong>에이전트 플레이그라운드</strong></div>
        <button class="demo" onclick="showDemo()"><span></span>Mock 데모</button>
      </header>
      <section class="playground-workbench" aria-label="에이전트 작업영역">
        <div class="workspace-header">
          <label class="agent-picker" for="workspace-agent">에이전트<select id="workspace-agent" aria-label="에이전트 · 고정 예시" title="이 파일럿은 CS 에이전트 한 개의 고정 예시입니다" disabled><option>CS 에이전트</option></select></label>
          <nav id="tabs" aria-label="작업 모드"></nav>
          <button class="help" onclick="showHelp()">사용법 <span>?</span></button>
        </div>
        <div id="context"></div>
        <div id="app"></div>
      </section>
      <div id="toast" role="status"></div>
    </main>
  </div>
  <div id="modal" class="modal-backdrop"></div>
  <script src="pilot-model.js"></script>
  <script src="trace-adapter.js"></script>
  <script src="mock-api.js"></script>
  <script src="trace-replay.js"></script>
  <script src="trace-views.js"></script>
  <script src="trace-inspection.js"></script>
  <script src="pilot.js"></script>
</body>
</html>
